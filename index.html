<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Wallet Testing</title>

<!-- Stable Ethers CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  text-align:center;
  padding-top:80px;
}
button{
  padding:15px 30px;
  background:gold;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}
.box{
  margin-top:30px;
  padding:20px;
  background:#111;
  border-radius:12px;
  display:inline-block;
}
</style>
</head>

<body>

<h2>🚀 Universal Wallet Test</h2>

<div class="box">
  <div id="detect">Checking wallet...</div>
  <button onclick="connectWallet()">Connect Wallet</button>
  <div id="result" style="margin-top:20px;color:gold;"></div>
</div>

<script>

let provider, signer;
let connecting = false;

// Detect wallet
window.addEventListener("load", () => {
  if(window.ethereum){
    document.getElementById("detect").innerHTML =
      "✅ Wallet Detected";
  } else {
    document.getElementById("detect").innerHTML =
      "❌ Open inside MetaMask / Trust Wallet";
  }
});

// Handle wallet changes
if(window.ethereum){

  window.ethereum.on("accountsChanged", () => {
    location.reload();
  });

  window.ethereum.on("chainChanged", () => {
    location.reload();
  });

}

async function connectWallet(){

  if(connecting) return;
  connecting = true;

  try{

    if(!window.ethereum){
      alert("Open inside MetaMask / Trust Wallet browser");
      connecting = false;
      return;
    }

    // Request Account
    const accounts = await window.ethereum.request({
      method: "eth_requestAccounts"
    });

    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();

    const network = await provider.getNetwork();

    // Auto switch to BSC
    if(network.chainId !== 56){
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x38" }]
      });
    }

    const address = accounts[0];

    document.getElementById("result").innerHTML =
      "Connected:<br>" + address +
      "<br><br>Network: BSC Mainnet (56)";

  }catch(err){
    alert("Connection Failed: " + err.message);
    console.log(err);
  }

  connecting = false;
}

</script>

</body>
</html>
